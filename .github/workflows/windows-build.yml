name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Set build metadata
        id: metadata
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $version = "0.1.${{ github.run_number }}"
          $packageName = "SnakeGame-Windows-Release-$version-$shortSha"
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          "build_version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: msbuild SnakeGame.sln /p:Configuration=Release /m

      - name: Run engine checks
        run: .\SnakeGame.Tests\bin\Release\SnakeGame.Tests.exe

      - name: Run Windows UI smoke checks and capture real app
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:bin\Release\WindowsSmoke.exe /reference:bin\Release\SnakeGame.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Configuration.dll tools\WindowsSmoke.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bin\Release\WindowsSmoke.exe artifacts\runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Source commit: $env:GITHUB_SHA" | Set-Content artifacts\runtime\BUILD_INFO.txt
          "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content artifacts\runtime\BUILD_INFO.txt

      - name: Upload runtime screenshots and verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnakeGame-Runtime-${{ github.sha }}
          path: artifacts/runtime
          if-no-files-found: error

      - name: Package app artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\SnakeGame
          Copy-Item bin\Release\SnakeGame.exe artifacts\SnakeGame\
          Copy-Item bin\Release\SnakeGame.exe.config artifacts\SnakeGame\
          Copy-Item README.md artifacts\SnakeGame\
          Copy-Item docs artifacts\SnakeGame\docs -Recurse
          $buildInfo = @(
            "SnakeGame Windows Release",
            "Version: $env:BUILD_VERSION",
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_RUN_NUMBER"
          )
          $buildInfo | Set-Content artifacts\SnakeGame\BUILD_INFO.txt
          Compress-Archive -Path artifacts\SnakeGame\* -DestinationPath artifacts\$env:PACKAGE_NAME.zip -Force

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: artifacts/${{ steps.metadata.outputs.package_name }}.zip

      - name: Write build summary
        shell: pwsh
        run: |
          "### SnakeGame Windows Build" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ``$env:BUILD_VERSION``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:SHORT_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Artifact: ``$env:PACKAGE_NAME``" >> $env:GITHUB_STEP_SUMMARY
          "- Includes: executable, config, README, docs, and BUILD_INFO.txt" >> $env:GITHUB_STEP_SUMMARY

